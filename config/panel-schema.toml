# Column order and types of dataset/dataset.parquet. panel_convert writes exactly these.
#
# Taken from the panel every result so far was computed on: DuckDB 1.5.5 read all 3,652 daily
# CSVs at once (read_csv, union_by_name) and guessed each column's type. The guesses are odd
# (sparse SMART columns are VARCHAR, a few raw counters DOUBLE), but pinning them keeps the
# rebuilt panel a drop-in replacement, and a type that no longer comes from sniffing cannot
# change with the DuckDB version. Later steps TRY_CAST every SMART column to DOUBLE anyway.
#
# A CSV column missing here stops the conversion; a column a quarter lacks is NULL.
# `filename` is not in the CSVs: it is ./raw-data/<zip name>/<csv name>, as in v1.

[columns]
date = "DATE"
serial_number = "VARCHAR"
model = "VARCHAR"
capacity_bytes = "DOUBLE"
failure = "BIGINT"
smart_1_normalized = "BIGINT"
smart_1_raw = "BIGINT"
