[project]
name = "hard-drive-analysis"
version = "4.0.0"
description = "Can smartctl (SMART) metrics predict how much life a hard drive has left?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "packaging>=26.3",
    "pandas>=2.2",
    "pyarrow>=20",
    "scikit-learn>=1.6",
    "scipy>=1.18",
]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"
data-verify = "data_verify.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The runner and the data gate, both vendored under src/.
module-name = ["data_pipeline", "data_verify"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# No "I" (isort): the imports are sorted and grouped, but ruff's isort would rewrite every
# wrapped multi-name import as one name per line.
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/gate/*" = ["E501"]
"tests/runner/*" = ["E501"]
