# Lint and test on every push and pull request.

name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src steps tests

      - name: Test
        run: uv run pytest -q
